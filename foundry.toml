# Foundry here is a TEST HARNESS only: the contracts themselves are Core
# Solidity (src/*.sol, compiled to build/*.json by scripts/check-core.sh).
# Core Solidity shares the .sol extension but is not solc-compatible, so
# src/ is excluded from forge twice: `skip` keeps forge build/test away
# from it, and `fmt.ignore` keeps forge fmt from parsing it. The tests
# under test/ read the compiled hex, deploy it, and drive it through
# hand-authored Solidity interfaces.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.33"
skip = ["src/**"]
fs_permissions = [{ access = "read", path = "./build" }]

[fmt]
ignore = ["src/*.sol", "src/**/*.sol"]
