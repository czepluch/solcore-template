# forge: no Core Solidity toolchain. Tests run against the committed build/
# artifacts, exactly like a fresh clone.
# reproduce: installs the toolchain pinned in toolchain.lock, rebuilds
# build/, and fails if the result differs from the committed artifacts or
# if a Core Solidity source is not formatted.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Run the Foundry suite against the committed artifacts
        run: forge test -vvv

      - name: Check harness formatting (fmt.ignore keeps Core sources out)
        run: forge fmt --check

      - name: Check abi/ has not drifted from the hand-authored interfaces
        run: scripts/sync-abi.sh --check

  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Core Solidity toolchain
        run: scripts/toolchain.sh install

      - name: Rebuild the artifacts
        run: scripts/check-core.sh

      - name: Check the rebuild matches the committed artifacts
        run: git diff --exit-code build/

      - name: Check Core Solidity formatting
        run: |
          solcore_fmt="$(scripts/toolchain.sh path solcore-fmt)"
          find src -name '*.sol' -exec "$solcore_fmt" --check {} +
